name: CI/CD

# Cada push a master valida y publica. Los PR sólo validan: nada que no haya
# entrado a master llega al sitio.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Un despliegue a la vez. Si llegan dos pushes seguidos, el segundo espera en
# lugar de pisar al primero a mitad de publicación.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Lint, build y publicar
    runs-on: ubuntu-latest
    permissions:
      # Publicar es un push a la rama gh-pages, así que hace falta escritura.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          # La versión sale de .nvmrc: una sola fuente de verdad con el entorno local.
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publicar en la rama gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # La rama es un artefacto, no historia: cada publicación la deja con
          # un único commit y sin restos de builds anteriores.
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
