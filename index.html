    <!--
      Pinta el tema antes del primer render. Si esto viviera en React, el
      navegador mostraría un flash blanco antes de aplicar el modo oscuro.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("cv-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* modo privado: se queda en claro */
        }
      })();
    </script>
